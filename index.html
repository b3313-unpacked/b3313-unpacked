<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3313 Unpacked</title>
<meta name="description" content="An interactive map, router and star checklist for B3313 Unabandoned.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <h1>B3313 Unpacked</h1>
      <p>A map and star guide for B3313 Unabandoned</p>
    </div>
    <div class="chips" id="chips"></div>
    <nav>
      <button data-action="tab" data-tab="explore">Explore</button>
      <button data-action="tab" data-tab="stars">Star list</button>
      <button data-action="tab" data-tab="find">Room select</button>
      <button data-action="tab" data-tab="route">Route</button>
      <button data-action="tab" data-tab="check" id="nav-check" hidden>Data check</button>
    </nav>
  </div>
</header>
<main id="app"><p class="muted">Loading the map…</p></main>
<footer>A fan-made guide. Not affiliated with Nintendo or the developers of B3313.</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
